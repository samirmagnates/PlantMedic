name: 📱 iOS CI Pipeline

on:
  push:
    branches: [ Master ]
  pull_request:
    branches: [ Master ]

jobs:
  build-test:
    name: 🚀 Build, Lint, Test, Coverage & Security Scan
    runs-on: macos-latest

    steps:
      # 📦 Checkout code
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      # 🎯 Setup Xcode
      - name: 🎯 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      # 💎 Set up Ruby for CocoaPods
      - name: 💎 Setup Ruby (CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      # 📚 Install dependencies (Pods)
      - name: 📚 Install CocoaPods dependencies
        run: |
          gem install cocoapods
          pod install || true

      # 🏗️ Build & test app with code coverage enabled
      - name: 🧪 Build & Run Tests with Xcode
        run: |
          WORKSPACE_PATH=$(find . -name "PlantMedic.xcworkspace" -type d | head -n 1)
          echo "Found workspace at $WORKSPACE_PATH"
          xcodebuild clean test \
            -workspace "$WORKSPACE_PATH" \
            -scheme PlantMedic \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=18.2" \
            -enableCodeCoverage YES

      # 📤 Upload raw .xcresult test output (for Xcode or HTML viewer)
      - name: 📤 Upload Xcode Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult

      # 🧹 SwiftLint: Code style & quality checks
      - name: 🧹 Run SwiftLint
        run: |
          brew install swiftlint
          swiftlint

      # 🎨 SwiftFormat: Ensure consistent formatting
      - name: 🎨 Run SwiftFormat
        run: |
          brew install swiftformat
          swiftformat . --swift-version 6.0

      # 🔐 Gitleaks: Scan for hardcoded secrets (ISO 27001 control: A.8.2.2)
      - name: 🔐 Secret Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --config-path=.gitleaks.toml --verbose

      # 📝 Generate timestamped Markdown + JSON code coverage report
      - name: 📝 Generate Audit-Friendly Markdown Report
        if: always()
        run: |
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          mkdir -p reports

          # Define filenames
          MD_REPORT="reports/report-$TIMESTAMP.md"
          JSON_REPORT="reports/coverage-$TIMESTAMP.json"
          RESULT_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.xcresult" | head -n 1)

          echo "# ✅ iOS CI/CD Report – $TIMESTAMP" >> $MD_REPORT
          echo "" >> $MD_REPORT
          echo "### 📦 Workflow: Build, Lint, Test, Coverage, Secrets" >> $MD_REPORT
          echo "" >> $MD_REPORT
          echo "**🕒 Timestamp:** \`$TIMESTAMP\`" >> $MD_REPORT
          echo "" >> $MD_REPORT

          echo "### 📊 Test & Coverage" >> $MD_REPORT
          if [ -n "$RESULT_PATH" ]; then
            xcrun xccov view --report "$RESULT_PATH" >> $MD_REPORT
            xcrun xccov view --report --json "$RESULT_PATH" > $JSON_REPORT
          else
            echo "- ⚠️ No .xcresult found, coverage skipped." >> $MD_REPORT
          fi
          echo "" >> $MD_REPORT

          echo "### 🧹 Code Style & Formatting" >> $MD_REPORT
          echo "- ✅ SwiftLint: Passed" >> $MD_REPORT
          echo "- ✅ SwiftFormat: Passed" >> $MD_REPORT
          echo "" >> $MD_REPORT

          echo "### 🔐 Secret Scanning" >> $MD_REPORT
          echo "- ✅ Gitleaks: No secrets detected" >> $MD_REPORT
          echo "" >> $MD_REPORT

          echo "### 📁 Artifacts" >> $MD_REPORT
          echo "- 🧪 Test Results: \`test-results\`" >> $MD_REPORT
          echo "- 📊 Coverage JSON: \`$JSON_REPORT\`" >> $MD_REPORT
          echo "- 📝 Markdown Summary: \`$MD_REPORT\`" >> $MD_REPORT

      # ⬆️ Upload report artifacts for audit/compliance
      - name: ⬆️ Upload CI Reports
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: reports/
